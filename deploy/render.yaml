services:
  - type: web
    name: nihon-loop
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false # set to https://<your-render-service>.onrender.com after first deploy
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: POWERLOBSTER_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./nihon.db
    disk:
      name: nihon-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
